# Pengaturan Server
server.name: "kibana"
server.host: "0.0.0.0"
server.port: 5601

# Pengaturan Elasticsearch
elasticsearch.hosts: ["http://elasticsearch:9200"]

# Pengaturan Keamanan (Local Development Mode)
# Menonaktifkan keamanan agar tidak perlu login/token
xpack.security.enabled: false

# Pengaturan Internasionalisasi
i18n.locale: "en"

# Pengaturan Logging
logging.root.level: info
logging.appenders.default.type: console
logging.appenders.default.layout.type: json
logging.root.appenders: ["default"]

# Monitoring UI
monitoring.ui.container.elasticsearch.enabled: true

